<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cppcrafter</title>
<meta name="description" content="cppcrafter">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050505;
    --ink: #ffffff;
    --dim: #a9a9b3;
    --line: #ffffff;
    --dot: rgba(255, 255, 255, 0.08);
    --grape: #7b3fa0;
    --fur: #f3a46b;
    --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
    --font-text: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; }

  html, body { height: 100%; }

  body {
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 1px, transparent 1px);
    background-size: 14px 14px;
    color: var(--ink);
    font-family: var(--font-text);
    display: grid;
    place-items: center;
    padding: 24px;
    min-height: 100%;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 28px;
    align-items: stretch;
    width: min(100%, 860px);
  }

  /* --- cat --- */
  .cat {
    width: clamp(220px, 28vw, 280px);
    aspect-ratio: 1;
    border: 3px solid var(--line);
    border-radius: 28px;
    overflow: hidden;
    background: #111;
    transition: transform 0.35s cubic-bezier(.3, 1.6, .5, 1);
    align-self: center;
  }
  .cat img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
  }
  .cat:hover { transform: rotate(-4deg) scale(1.04); }

  /* --- info panel --- */
  .panel {
    border: 3px solid var(--line);
    border-radius: 28px;
    padding: 36px 32px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: 26px;
    text-align: center;
    background: rgba(0, 0, 0, 0.85);
  }

  .nick {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(1.7rem, 5.2vw, 2.6rem);
    letter-spacing: -0.02em;
    line-height: 1.1;
    word-break: break-word;
  }
  .nick .cursor {
    display: inline-block;
    width: 0.5em;
    height: 0.12em;
    background: var(--ink);
    margin-left: 0.08em;
    vertical-align: baseline;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .about {
    font-size: clamp(1.05rem, 2.6vw, 1.3rem);
    font-weight: 500;
    line-height: 1.4;
  }
  .about span { color: var(--dim); display: block; font-weight: 400; font-size: 0.9em; margin-top: 4px; }

  .stack {
    list-style: none;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  .stack li {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 0.95rem;
    padding: 10px 20px;
    border: 2px solid var(--line);
    border-radius: 999px;
  }
  .stack li:first-child { background: var(--ink); color: #000; }

  .tg {
    width: 58px;
    height: 58px;
    border: 3px solid var(--line);
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: var(--ink);
    text-decoration: none;
    transition: background 0.2s, color 0.2s, transform 0.2s;
  }
  .tg svg { width: 28px; height: 28px; margin-right: 2px; }
  .tg:hover { background: var(--ink); color: #000; transform: scale(1.08); }
  .tg:focus-visible, .cat:focus-visible { outline: 3px solid #5cc8ff; outline-offset: 4px; }

  .tg-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .tg-wrap small { color: var(--dim); font-size: 0.9rem; }

  /* --- phone --- */
  @media (max-width: 720px) {
    body { padding: 18px; align-items: start; }
    .card { grid-template-columns: 1fr; gap: 20px; margin: auto 0; }
    .cat { width: min(70vw, 260px); justify-self: center; }
    .panel { padding: 28px 20px 24px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .nick .cursor { animation: none; }
    .cat, .tg { transition: none; }
  }
</style>
</head>
