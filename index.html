<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cppcrafter | Portfolio</title>
    
    <!-- Подключение Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Подключение шрифта Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Подключение Material Symbols Rounded -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #121212;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 antialiased text-white relative overflow-hidden">

    <!-- Фоновые декорации для усиления эффекта стекла (опционально) -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-[#D0BCFF] rounded-full mix-blend-multiply filter blur-[128px] opacity-20"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-[#4F378B] rounded-full mix-blend-multiply filter blur-[128px] opacity-20"></div>

    <!-- Glassmorphism Panel -->
    <main class="bg-white/5 backdrop-blur-md border border-white/10 rounded-[2rem] p-8 md:p-12 flex flex-col items-center max-w-md w-full shadow-2xl relative z-10">
        
        <!-- Avatar Block -->
        <div class="relative w-32 h-32 rounded-full border-4 border-[#D0BCFF] bg-white/10 flex items-center justify-center overflow-hidden shadow-lg">
            <!-- Иконка человека (заглушка) -->
            <span class="material-symbols-rounded absolute text-5xl text-[#D0BCFF]">person</span>
            <!-- Сама аватарка -->
            <img src="avatar.jpg" alt="Avatar" class="absolute z-10 w-full h-full object-cover transition-opacity duration-300" onerror="this.style.display='none'">
        </div>

        <!-- Pale Chain Button -->
        <a href="https://palechain.sbs" target="_blank" rel="noopener noreferrer" class="mt-4 mb-6 px-5 py-2 bg-[#D0BCFF]/20 hover:bg-[#D0BCFF]/30 text-[#D0BCFF] rounded-full font-semibold transition-colors flex items-center gap-2 shadow-sm border border-[#D0BCFF]/10">
            <span class="material-symbols-rounded text-xl">link</span>
            Pale Chain
        </a>

        <!-- Text Content -->
        <h1 class="text-4xl font-bold text-white mb-3 text-center tracking-tight">Ку вась!</h1>
        <p class="text-gray-300 text-lg text-center max-w-sm mb-8 font-medium">
            мне 14, люблю чет писать вайбкодить, берусь за все невозможное
        </p>

        <!-- TON Wallet Button -->
        <button onclick="copyWallet()" class="bg-[#4F378B] hover:bg-[#D0BCFF] text-white hover:text-[#381E72] transition-colors rounded-2xl px-6 py-3.5 flex items-center justify-between gap-4 font-medium shadow-lg w-full group outline-none focus-visible:ring-2 focus-visible:ring-[#D0BCFF]">
            <div class="flex flex-col text-left">
                <span class="text-[10px] uppercase tracking-wider opacity-80 font-bold mb-0.5">TON Адрес</span>
                <span class="text-base tracking-wide">chainholder.ton</span>
            </div>
            <span id="copy-icon" class="material-symbols-rounded group-hover:scale-110 transition-transform">content_copy</span>
        </button>

    </main>

    <!-- Scripts -->
    <script>
        function copyWallet() {
            const address = 'chainholder.ton';
            
            // Надежное копирование
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(address);
            } else {
                const tempInput = document.createElement("input");
                tempInput.value = address;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand("copy");
                document.body.removeChild(tempInput);
            }
            
            // Анимация иконки
            const icon = document.getElementById('copy-icon');
            icon.innerText = 'check';
            icon.style.color = '#a8d08d'; // Добавляем зеленый оттенок для успешного копирования
            
            // Возврат в исходное состояние
            setTimeout(() => {
                icon.innerText = 'content_copy';
                icon.style.color = ''; 
            }, 2000);
        }
    </script>
</body>
</html>
